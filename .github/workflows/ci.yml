name: CI Suite

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile violet_bot.py win_invite_endpoint.py
      - run: python -m pytest -q

  node-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: js-bot/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        timeout-minutes: 3
      - run: npm test
