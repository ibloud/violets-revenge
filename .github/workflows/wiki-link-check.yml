name: Wiki Link Checker

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  gollum:

permissions:
  contents: read

jobs:
  check-wiki-links:
    runs-on: ubuntu-latest
    steps:
      - name: Detect and clone wiki
        id: wiki
        shell: bash
        run: |
          WIKI_URL="https://github.com/${{ github.repository }}.wiki.git"
          if git ls-remote "$WIKI_URL" HEAD >/dev/null 2>&1; then
            git clone --depth 1 "$WIKI_URL" wiki
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No initialized wiki repository; link check skipped."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install markdown-link-check
        if: steps.wiki.outputs.available == 'true'
        run: npm install -g markdown-link-check

      - name: Check links in all wiki Markdown files
        if: steps.wiki.outputs.available == 'true'
        shell: bash
        run: |
          BROKEN=0
          while IFS= read -r file; do
            echo "Checking: $file"
            markdown-link-check "$file" --quiet || BROKEN=1
          done < <(find wiki -name "*.md" -type f)
          if [ "$BROKEN" = "1" ]; then
            echo "::error::Broken links were found in the wiki."
            exit 1
          fi
